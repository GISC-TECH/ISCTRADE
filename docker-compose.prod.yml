# Overrides de produção: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Remove bind mounts/--reload e não publica portas internas (apenas o Caddy expõe 80/443).
x-prod-env: &prod-env
  ENVIRONMENT: production
  DEBUG: "false"
  COOKIE_SECURE: "true"

services:
  frontend:
    ports: !reset []

  migrate:
    environment: *prod-env

  backend:
    # 2 workers uvicorn: métricas agregadas via PROMETHEUS_MULTIPROC_DIR (recriado a cada start).
    command: >-
      sh -c "rm -rf /tmp/prometheus && mkdir -p /tmp/prometheus &&
      exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2 --proxy-headers --forwarded-allow-ips '*'"
    volumes: !reset []
    ports: !reset []
    environment:
      <<: *prod-env
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus

  celery_worker:
    volumes: !reset []
    environment:
      <<: *prod-env
      DB_USE_NULLPOOL: "true"
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus
      METRICS_PORT: "9101"

  celery_worker_trading:
    volumes: !reset []
    environment:
      <<: *prod-env
      DB_USE_NULLPOOL: "true"
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus
      METRICS_PORT: "9101"

  celery_beat:
    volumes: !reset []
    environment:
      <<: *prod-env
      DB_USE_NULLPOOL: "true"

  streams:
    volumes: !reset []
    environment:
      <<: *prod-env
      METRICS_PORT: "9102"

  postgres:
    ports: !reset []

  redis:
    ports: !reset []
