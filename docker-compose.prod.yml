# Overrides de produção: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
services:
  frontend:
    ports: !reset []

  backend:
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2 --proxy-headers"
    volumes: !reset []
    ports: !reset []
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      COOKIE_SECURE: "true"

  celery_worker:
    volumes: !reset []
    environment:
      ENVIRONMENT: production

  postgres:
    ports: !reset []

  redis:
    ports: !reset []
