name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Executa o teste de migração (upgrade/downgrade/check) contra PostgreSQL 15 real.
      TEST_POSTGRES_URL: postgresql+asyncpg://ci:ci-only-password@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .
      - name: pytest
        run: pytest -q

  frontend:
    name: Frontend (lint + tsc + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: next lint
        run: npm run lint
      - name: tsc --noEmit
        run: npx tsc --noEmit
      - name: next build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  compose:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar compose (dev e prod)
        run: |
          cp .env.example .env
          docker compose config -q
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q
      - name: shellcheck
        run: shellcheck scripts/*.sh

  images:
    name: Docker images (build only)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend
        run: docker build -t btp-backend:ci ./backend
      - name: Build frontend
        run: docker build -t btp-frontend:ci ./frontend
      - name: Backend image smoke (imports + alembic heads)
        run: docker run --rm -e JWT_SECRET=ci -e MASTER_ENCRYPTION_KEY=$(python3 -c "import os,base64;print(base64.b64encode(os.urandom(32)).decode())") btp-backend:ci sh -c "python -c 'import app.main, app.tasks.celery_app, app.workers.streams' && alembic heads"
