# Stack completa. Desenvolvimento: `docker compose up --build`.
# Produção: `docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d` (ou scripts/deploy.sh).
name: binance-trading-platform

x-backend-common: &backend-common
  build:
    context: ./backend
  image: btp-backend:latest
  env_file: .env
  networks:
    - backend
  restart: unless-stopped

x-after-migrate: &after-migrate
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  migrate:
    condition: service_completed_successfully

services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - frontend
      - backend
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
        BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:8000}
    image: btp-frontend:latest
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - frontend
      - backend
    restart: unless-stopped

  # Executa as migrações Alembic uma única vez antes de API/workers subirem.
  migrate:
    <<: *backend-common
    command: alembic upgrade head
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    <<: *backend-common
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "127.0.0.1:8000:8000"
    depends_on: *after-migrate
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

  celery_worker:
    <<: *backend-common
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=2
    environment:
      DB_USE_NULLPOOL: "true"
    volumes:
      - ./backend:/app
    depends_on: *after-migrate
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.celery_app inspect ping -d celery@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 30s
      timeout: 15s
      start_period: 30s
      retries: 3

  # Agendador: tick dos bots, reconciliação, snapshots de equity e reset diário (00:00 UTC).
  # Mantenha exatamente UMA instância.
  celery_beat:
    <<: *backend-common
    command: celery -A app.tasks.celery_app beat --loglevel=info --schedule /tmp/celerybeat-schedule
    environment:
      DB_USE_NULLPOOL: "true"
    volumes:
      - ./backend:/app
    depends_on: *after-migrate
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/celerybeat-schedule || test -f /tmp/celerybeat-schedule.db"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  # WebSockets da Binance (user data + mark price) e reconciliação por eventos. Mantenha UMA instância.
  streams:
    <<: *backend-common
    command: python -m app.workers.streams
    volumes:
      - ./backend:/app
    depends_on: *after-migrate

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trading}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-trading}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend
    restart: unless-stopped

networks:
  frontend:
    name: btp_frontend
  backend:
    name: btp_backend

volumes:
  postgres_data:
    name: btp_postgres_data
  redis_data:
    name: btp_redis_data
  caddy_data:
    name: btp_caddy_data
  caddy_config:
    name: btp_caddy_config
